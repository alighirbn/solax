<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolaX Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sun:#FFB800;--sun2:#FF6B00;--grid:#00D4FF;--bat:#00FF88;
    --eps:#FF7744;--load:#BB88FF;--bg:#050D1A;--s1:#0A1628;--s2:#0F1F3D;
    --border:rgba(0,212,255,0.1);--text:#E8F4FF;--dim:#4A6A8A;--red:#FF4455;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Cairo',Tahoma,sans-serif;min-height:100vh;
    background-image:
      radial-gradient(ellipse at 15% 10%,rgba(255,184,0,.05) 0%,transparent 50%),
      radial-gradient(ellipse at 85% 85%,rgba(0,212,255,.05) 0%,transparent 50%),
      linear-gradient(rgba(0,212,255,.02) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,212,255,.02) 1px,transparent 1px);
    background-size:100% 100%,100% 100%,40px 40px,40px 40px;
  }
  .wrap{max-width:960px;margin:0 auto;padding:16px;}

  /* HEADER */
  header{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--border);}
  .logo{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;color:var(--sun);letter-spacing:3px;text-shadow:0 0 20px rgba(255,184,0,.5);}
  .logo span{color:var(--grid);}
  .logo small{font-size:10px;color:var(--dim);display:block;letter-spacing:1px;font-family:'Cairo',sans-serif;font-weight:400;margin-top:2px;}
  .hright{display:flex;align-items:center;gap:10px;}
  .hbadge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);background:var(--s1);padding:5px 12px;border-radius:20px;border:1px solid var(--border);}
  .dot{width:8px;height:8px;border-radius:50%;background:#333;transition:.3s;}
  .dot.ok{background:var(--bat);box-shadow:0 0 6px var(--bat);animation:blink 2s infinite;}
  .dot.err{background:var(--red);}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  /* TABS */
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--s1);color:var(--dim);transition:.2s;}
  .tab.active{background:var(--s2);color:var(--text);border-color:rgba(0,212,255,.3);}
  .tab:hover{border-color:rgba(0,212,255,.25);color:var(--text);}
  .panel{display:none;}.panel.active{display:block;}

  /* HERO */
  .hero{text-align:center;padding:8px 0 16px;}
  .sun-wrap{width:120px;height:120px;margin:0 auto 10px;position:relative;display:flex;align-items:center;justify-content:center;}
  .sun-wrap::before{content:'';position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--sun),var(--sun2),var(--sun));animation:spin 5s linear infinite;opacity:.5;}
  .sun-wrap::after{content:'';position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(255,184,0,.1),transparent 70%);animation:breathe 3s ease-in-out infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.1);opacity:1}}
  .sun-inner{width:100%;height:100%;border-radius:50%;background:var(--s1);border:2px solid var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1;}
  .pv-val{font-family:'Orbitron',monospace;font-size:24px;font-weight:700;color:var(--sun);text-shadow:0 0 12px rgba(255,184,0,.6);line-height:1;}
  .pv-unit{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:1px;}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-top:5px;}
  .s-normal{background:rgba(0,255,136,.1);color:var(--bat);border:1px solid rgba(0,255,136,.3);}
  .s-wait{background:rgba(255,184,0,.1);color:var(--sun);border:1px solid rgba(255,184,0,.3);}
  .s-fault{background:rgba(255,68,68,.1);color:var(--red);border:1px solid rgba(255,68,68,.3);}
  .s-offgrid{background:rgba(0,212,255,.1);color:var(--grid);border:1px solid rgba(0,212,255,.3);}

  /* GRID */
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px;}
  .g2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px;}
  .g1{margin-bottom:12px;}

  /* CARD */
  .card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px;position:relative;overflow:hidden;transition:border-color .25s,transform .2s;}
  .card:hover{border-color:rgba(0,212,255,.25);transform:translateY(-1px);}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:12px 12px 0 0;}
  .c-sun::before{background:linear-gradient(90deg,var(--sun),var(--sun2));}
  .c-bat::before{background:linear-gradient(90deg,var(--bat),#00AA55);}
  .c-grid::before{background:linear-gradient(90deg,var(--grid),#0066AA);}
  .c-eps::before{background:linear-gradient(90deg,var(--eps),#CC3300);}
  .c-load::before{background:linear-gradient(90deg,var(--load),#8833CC);}
  .c-info::before{background:linear-gradient(90deg,#667788,#334455);}
  .c-calc::before{background:linear-gradient(90deg,#88FFCC,#00AAAA);}

  .cicon{font-size:22px;margin-bottom:6px;display:block;}
  .clabel{font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
  .cval{font-family:'Orbitron',monospace;font-size:20px;font-weight:700;line-height:1;}
  .cval.lg{font-size:24px;}
  .cval.sm{font-size:16px;}
  .cunit{font-family:'Cairo',sans-serif;font-size:11px;color:var(--dim);margin-right:2px;}
  .csub{font-size:11px;color:var(--dim);margin-top:5px;}
  .csub.good{color:var(--bat);}
  .csub.warn{color:var(--sun);}
  .csub.bad{color:var(--red);}

  .v-sun{color:var(--sun);text-shadow:0 0 8px rgba(255,184,0,.4);}
  .v-bat{color:var(--bat);text-shadow:0 0 8px rgba(0,255,136,.4);}
  .v-grid{color:var(--grid);text-shadow:0 0 8px rgba(0,212,255,.4);}
  .v-eps{color:var(--eps);}
  .v-load{color:var(--load);}
  .v-calc{color:#88FFCC;}
  .v-gray{color:#778899;}
  .v-red{color:var(--red);}

  /* BAR */
  .bar{height:6px;background:var(--s2);border-radius:3px;margin-top:8px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;transition:width 1s ease;}
  .bar-sun{background:linear-gradient(90deg,var(--sun),var(--sun2));box-shadow:0 0 6px rgba(255,184,0,.3);}
  .bar-bat{background:linear-gradient(90deg,var(--bat),#00AA55);box-shadow:0 0 6px rgba(0,255,136,.3);}

  /* SECTION TITLE */
  .sec{font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin:16px 0 10px;padding-right:10px;border-right:2px solid var(--grid);}

  /* TABLE */
  .tbl{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;}
  .tbl-title{padding:12px 16px;font-size:12px;color:var(--dim);letter-spacing:1px;border-bottom:1px solid var(--border);}
  .trow{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);transition:background .15s;}
  .trow:last-child{border-bottom:none;}
  .trow:hover{background:rgba(0,212,255,.03);}
  .tname{font-size:13px;color:var(--dim);}
  .tval{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;}
  .tval small{font-family:'Cairo',sans-serif;font-size:10px;color:var(--dim);margin-right:2px;}

  /* FLOW DIAGRAM */
  .flow{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:12px;}
  .flow-title{font-size:12px;color:var(--dim);letter-spacing:1px;margin-bottom:16px;}
  .flow-grid{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:1fr auto 1fr;gap:10px;align-items:center;justify-items:center;}
  .fnode{background:var(--s2);border-radius:10px;padding:10px 14px;text-align:center;border:1px solid var(--border);min-width:90px;}
  .fnode-icon{font-size:20px;display:block;margin-bottom:3px;}
  .fnode-label{font-size:10px;color:var(--dim);}
  .fnode-val{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;margin-top:2px;}
  .farrow{font-size:18px;color:var(--dim);display:flex;align-items:center;justify-content:center;}
  .farrow.active-sun{color:var(--sun);text-shadow:0 0 8px rgba(255,184,0,.5);}
  .farrow.active-bat{color:var(--bat);text-shadow:0 0 8px rgba(0,255,136,.5);}
  .farrow.active-grid{color:var(--grid);text-shadow:0 0 8px rgba(0,212,255,.5);}
  .farrow.active-eps{color:var(--eps);}
  .center-node{background:var(--s2);border-radius:50%;width:64px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid rgba(0,212,255,.2);font-size:9px;color:var(--dim);}
  .center-node b{font-family:'Orbitron',monospace;font-size:12px;color:var(--grid);}

  /* FOOTER */
  .footer{display:flex;justify-content:space-between;align-items:center;background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:10px 16px;margin-top:8px;}
  .f-info{font-size:10px;color:var(--dim);line-height:1.8;}
  .f-info b{color:var(--text);}
  .rbtn{background:linear-gradient(135deg,var(--sun),var(--sun2));color:#000;border:none;padding:7px 18px;border-radius:7px;font-family:'Cairo',sans-serif;font-weight:700;font-size:12px;cursor:pointer;transition:opacity .2s,transform .1s;}
  .rbtn:hover{opacity:.85;}
  .rbtn:active{transform:scale(.97);}
  .rbtn:disabled{opacity:.3;cursor:not-allowed;}

  /* LOADING/ERROR */
  .loading{text-align:center;padding:50px 20px;color:var(--dim);}
  .spinner{width:36px;height:36px;margin:0 auto 12px;border:3px solid var(--border);border-top-color:var(--sun);border-radius:50%;animation:spin .8s linear infinite;}
  .errbox{background:rgba(255,68,68,.07);border:1px solid rgba(255,68,68,.2);border-radius:10px;padding:20px;text-align:center;color:#FF8888;font-size:13px;line-height:1.9;margin-bottom:12px;}

  /* TEMP INDICATOR */
  .temp-bar{display:flex;align-items:center;gap:6px;margin-top:6px;}
  .temp-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .temp-track{flex:1;height:4px;background:var(--s2);border-radius:2px;overflow:hidden;}
  .temp-fill{height:100%;border-radius:2px;transition:width 1s ease;}

  @media(max-width:640px){
    .g4{grid-template-columns:repeat(2,1fr);}
    .g3{grid-template-columns:repeat(2,1fr);}
    .cval{font-size:17px;}.cval.lg{font-size:20px;}
    .pv-val{font-size:20px;}
    .flow-grid{grid-template-columns:1fr auto 1fr;}
    .fnode{min-width:70px;padding:8px 10px;}
  }

  /* UNIT TOGGLE */
  .unit-toggle{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--s2);border:1px solid rgba(0,212,255,.25);border-radius:8px;
    padding:5px 12px;cursor:pointer;transition:.2s;gap:0;
    font-family:'Orbitron',monospace;
  }
  .unit-toggle:hover{border-color:rgba(0,212,255,.5);background:rgba(0,212,255,.08);}
  .unit-toggle.amp{border-color:rgba(0,255,136,.35);background:rgba(0,255,136,.06);}
  .unit-toggle span{font-size:16px;font-weight:900;color:var(--sun);line-height:1;transition:.2s;}
  .unit-toggle.amp span{color:var(--bat);}
  .unit-toggle small{font-size:9px;color:var(--dim);margin-top:1px;font-family:'Cairo',sans-serif;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">SOLAR<span>X</span><small>X1-Lite-12K-LV • SN: 10JP00011F900A</small></div>
    <div class="hright">
      <button class="unit-toggle" id="unitBtn" onclick="toggleUnit()" title="تبديل وحدة القياس">
        <span id="unitLabel">W</span>
        <small id="unitSub">واط</small>
      </button>
      <div class="hbadge"><div class="dot" id="dot"></div><span id="stxt">جاري...</span></div>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('overview')">⚡ نظرة عامة</div>
    <div class="tab" onclick="switchTab('battery')">🔋 البطارية</div>
    <div class="tab" onclick="switchTab('pv')">☀️ الألواح</div>
    <div class="tab" onclick="switchTab('grid')">🔌 الشبكة</div>
    <div class="tab" onclick="switchTab('eps')">🏠 EPS</div>
    <div class="tab" onclick="switchTab('stats')">📊 الإحصائيات</div>
  </div>

  <div id="main">
    <div class="loading"><div class="spinner"></div><div>جاري تحميل بيانات الجهاز...</div></div>
  </div>

  <div class="footer">
    <div class="f-info">
      آخر تحديث: <b id="lastUp">—</b> &nbsp;|&nbsp; وقت الرفع: <b id="uploadT">—</b>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div id="countdown" onclick="load();startCountdown();" title="تحديث تلقائي" style="
        width:36px;height:36px;border-radius:50%;cursor:pointer;
        display:flex;align-items:center;justify-content:center;
        background:conic-gradient(var(--grid) 0deg, transparent 0);
        box-shadow:0 0 8px rgba(0,212,255,.2);
        position:relative;transition:box-shadow .3s;
      ">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--s1);display:flex;align-items:center;justify-content:center;">
          <span style="font-family:Orbitron,monospace;font-size:11px;font-weight:700;color:var(--grid)" id="ctxt">10</span>
        </div>
      </div>
      <button class="rbtn" id="rbtn" onclick="load();startCountdown();">🔄 تحديث</button>
    </div>
  </div>
</div>

<script>
const TOKEN   = "202603160831272691378815";
const WIFI_SN = "SNWVR2LQ3E";
const TARGET  = "https://global.solaxcloud.com/api/v2/dataAccess/realtimeInfo/get";
const PROXY   = "https://corsproxy.io/?" + encodeURIComponent(TARGET);

const STATUS={
  100:{l:"انتظار التشغيل",c:"s-wait"},101:{l:"فحص ذاتي",c:"s-wait"},
  102:{l:"عمل طبيعي ✓",c:"s-normal"},103:{l:"خطأ مؤقت",c:"s-fault"},
  104:{l:"خطأ دائم",c:"s-fault"},105:{l:"تحديث البرنامج",c:"s-wait"},
  107:{l:"Off-grid ⚡",c:"s-offgrid"},109:{l:"وضع النوم",c:"s-wait"},
  110:{l:"استعداد",c:"s-wait"},130:{l:"VPP",c:"s-normal"},
  150:{l:"استخدام ذاتي",c:"s-normal"},151:{l:"وقت إجباري",c:"s-normal"},
  152:{l:"وضع الاحتياط",c:"s-normal"},153:{l:"أولوية التغذية",c:"s-normal"},
  131:{l:"TOU - ذاتي",c:"s-normal"},132:{l:"TOU - شحن",c:"s-normal"},
  133:{l:"TOU - تفريغ",c:"s-normal"},
};

const INV_TYPE={
  "1":"X1-LX","2":"X-Hybrid","3":"X1-Hybiyd/fit","4":"X1-Boost/Air/Mini",
  "5":"X3-Hybiyd/fit","6":"X3-20K","7":"X3-MIC/PRO","8":"X1-Smart",
  "9":"X1-AC","10":"A1-Hybrid","11":"A1-Fit","12":"A1-Grid",
  "13":"J1-ESS","14":"X3-Hybiyd/fit Pro","15":"X3-MIC/PRO G2",
  "16":"X1-SPT","17":"X1-Boost3.0","19":"X3-MIC/PRO G3",
  "20":"X1-SL","21":"X3-FIT","22":"X3-Ultra",
  "24":"X1-Fit","25":"X3-Mega G2","26":"X1-Boost Air Mini G4",
  "39":"X1-Hybrid G4","40":"X3-Hybrid G4",
  "103":"X1-Lite-12K-LV",
};

const f=(v,d=1)=>(v==null||v===undefined||isNaN(+v))?"—":(+v).toFixed(d);
const fkw=(v)=>{
  if(v==null||isNaN(+v))return"—";
  const n=+v;
  return n>=1000?f(n/1000,2)+" kW":f(n,0)+" W";
};

let currentTab="overview";
let lastData=null;
let unitMode="W"; // "W" or "A"
const VOLT=230; // fallback voltage for W->A conversion

function toggleUnit(){
  unitMode = unitMode==="W" ? "A" : "W";
  const btn=document.getElementById("unitBtn");
  const lbl=document.getElementById("unitLabel");
  const sub=document.getElementById("unitSub");
  if(unitMode==="A"){
    btn.classList.add("amp"); lbl.textContent="A"; sub.textContent="أمبير";
  } else {
    btn.classList.remove("amp"); lbl.textContent="W"; sub.textContent="واط";
  }
  if(lastData) renderAll(lastData);
}

// Convert power W to display value based on current unit
// volt: the voltage to use for W->A calc
function pw(watts, volt){
  if(watts==null||isNaN(+watts)) return {v:"—",u:unitMode};
  const w=+watts;
  if(unitMode==="W") return {v:f(w,0), u:"W"};
  const v2 = (volt&&!isNaN(+volt)&&+volt>0) ? +volt : VOLT;
  return {v:f(Math.abs(w)/v2, 2), u:"A"};
}
function pwStr(watts, volt){
  const r=pw(watts,volt);
  return `${r.v}<span class="cunit">${r.u}</span>`;
}
function pwVal(watts, volt){
  const r=pw(watts,volt);
  return r.v;
}
function pwUnit(){
  return unitMode;
}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll(".tab").forEach((t,i)=>{
    const tabs=["overview","battery","pv","grid","eps","stats"];
    t.classList.toggle("active",tabs[i]===tab);
  });
  if(lastData) renderAll(lastData);
}

function tempColor(t){
  if(t==null)return"#667788";
  if(t<40)return"#00FF88";
  if(t<55)return"#FFB800";
  return"#FF4455";
}
function tempWidth(t){
  if(t==null)return 0;
  return Math.min(100,Math.max(0,(+t/80)*100));
}
function batStatusTxt(s){
  return s=="0"?{t:"طبيعي ✓",c:"good"}:s=="1"?{t:"خطأ ✗",c:"bad"}:s=="2"?{t:"غير متصل",c:"warn"}:{t:"—",c:""};
}


function buildFlowSVG(r, pv, bp, fp){
  const pvOn  = pv > 20;
  const batOn = bp != null && Math.abs(bp) > 10;
  const batCharge = bp > 10;
  const batDischarge = bp < -10;
  const gridOn = Math.abs(fp||0) > 10;
  const gridExport = fp > 10;
  const gridImport = fp < -10;
  const epsOn = (r.peps1||0) > 10;
  const soc = r.soc ?? 0;

  const pvW  = pwVal(pv, r.vac1);
  const batW = pwVal(Math.abs(bp||0), r.batVoltage);
  const gridW= pwVal(Math.abs(fp||0), r.vac1);
  const epsW = pwVal(r.peps1??0, r.veps1||230);
  const unit = pwUnit();

  // Colors
  const cSun  = "#FFB800";
  const cBat  = "#00FF88";
  const cGrid = "#00D4FF";
  const cEps  = "#FF7744";
  const cInv  = "#4488FF";
  const cDim  = "#1A2A40";
  const cBg   = "transparent";

  // SVG: 500x280
  // Nodes: PV(80,60) INV(250,140) BAT(80,220) GRID(420,60) LOAD(420,220)
  const W=500, H=280;
  const PV   = {x:75,  y:60};
  const INV  = {x:250, y:140};
  const BAT  = {x:75,  y:220};
  const GRID = {x:425, y:60};
  const LOAD = {x:425, y:220};

  function node(cx,cy,icon,label,val,color,glowOn){
    const glow = glowOn ? `<circle cx="${cx}" cy="${cy}" r="46" fill="${color}" opacity="0.07"><animate attributeName="r" values="44;50;44" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.07;0.13;0.07" dur="2.5s" repeatCount="indefinite"/></circle>` : '';
    return `${glow}
    <circle cx="${cx}" cy="${cy}" r="40" fill="${cDim}" stroke="${color}" stroke-width="${glowOn?2:1}" opacity="${glowOn?1:0.5}"/>
    <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="22" dominant-baseline="middle">${icon}</text>
    <text x="${cx}" y="${cy+13}" text-anchor="middle" font-family="Orbitron,monospace" font-size="9" font-weight="700" fill="${glowOn?color:'#445566'}">${val}${unit}</text>
    <text x="${cx}" y="${cy+33}" text-anchor="middle" font-family="Cairo,sans-serif" font-size="10" fill="#4A6A8A">${label}</text>`;
  }

  function invNode(){
    return `
    <circle cx="${INV.x}" cy="${INV.y}" r="48" fill="rgba(68,136,255,0.05)" stroke="rgba(68,136,255,0.2)" stroke-width="1">
      <animate attributeName="r" values="46;52;46" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="${INV.x}" cy="${INV.y}" r="38" fill="${cDim}" stroke="${cInv}" stroke-width="2"/>
    <text x="${INV.x}" y="${INV.y-6}" text-anchor="middle" font-size="18" dominant-baseline="middle">⚙️</text>
    <text x="${INV.x}" y="${INV.y+10}" text-anchor="middle" font-family="Orbitron,monospace" font-size="10" font-weight="900" fill="${cInv}">INV</text>
    <text x="${INV.x}" y="${INV.y+26}" text-anchor="middle" font-family="Cairo,sans-serif" font-size="9" fill="#4A6A8A">X1-Lite</text>`;
  }

  // Animated dashed path with moving dots
  function animPath(x1,y1,x2,y2,color,active,dur,reverse,cx1,cy1,cx2,cy2){
    if(!active) {
      const d = cx1!=null
        ? `M${x1},${y1} C${cx1},${cy1} ${cx2},${cy2} ${x2},${y2}`
        : `M${x1},${y1} L${x2},${y2}`;
      return `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="6,8" opacity="0.15"/>`;
    }
    const d = cx1!=null
      ? `M${x1},${y1} C${cx1},${cy1} ${cx2},${cy2} ${x2},${y2}`
      : `M${x1},${y1} L${x2},${y2}`;
    const dir = reverse ? "100%;0%" : "0%;100%";
    return `
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-dasharray="6,8" opacity="0.35"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-dasharray="18,120" opacity="0.9" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="${dir}" dur="${dur}s" repeatCount="indefinite"/>
    </path>
    <path d="${d}" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="4,200" opacity="0.6" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="${dir}" dur="${dur}s" repeatCount="indefinite"/>
    </path>`;
  }

  const pvDur   = pvOn   ? Math.max(0.8, 3 - pv/2000)   : 2;
  const batDur  = batOn  ? Math.max(0.8, 3 - Math.abs(bp)/2000) : 2;
  const gridDur = gridOn ? Math.max(0.8, 3 - Math.abs(fp)/2000) : 2;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:300px;display:block">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(15,31,61,0.8)"/>
      <stop offset="100%" stop-color="rgba(5,13,26,0.9)"/>
    </radialGradient>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#bgGrad)" rx="10"/>

  <!-- PATHS -->
  <!-- PV → INV -->
  ${animPath(PV.x+40, PV.y, INV.x-38, INV.y-20, cSun, pvOn, pvDur, false, 160,70, 200,120)}
  <!-- BAT ↔ INV -->
  ${animPath(BAT.x+40, BAT.y, INV.x-38, INV.y+20, cBat, batOn, batDur, batDischarge, 160,220, 200,160)}
  <!-- INV → GRID -->
  ${animPath(INV.x+38, INV.y-20, GRID.x-40, GRID.y, cGrid, gridExport, gridDur, false, 310,120, 360,70)}
  <!-- GRID → INV (import) -->
  ${animPath(GRID.x-40, GRID.y+10, INV.x+38, INV.y-10, cGrid, gridImport, gridDur, false, 370,80, 320,130)}
  <!-- INV → LOAD/EPS -->
  ${animPath(INV.x+38, INV.y+20, LOAD.x-40, LOAD.y, cEps, epsOn, 1.2, false, 310,160, 360,210)}

  <!-- NODES -->
  ${node(PV.x,   PV.y,   "☀️","الألواح",pvW,   cSun,  pvOn)}
  ${node(BAT.x,  BAT.y,  "🔋","البطارية",batW,  cBat,  batOn)}
  ${node(GRID.x, GRID.y, "🔌","الشبكة",  gridW, cGrid, gridOn)}
  ${node(LOAD.x, LOAD.y, "🏠","الحمل",   epsW,  cEps,  epsOn)}
  ${invNode()}

  <!-- SOC bar under battery -->
  <rect x="35" y="266" width="80" height="5" rx="2.5" fill="rgba(0,255,136,0.1)"/>
  <rect x="35" y="266" width="${Math.round(soc*0.8)}" height="5" rx="2.5" fill="${cBat}" opacity="0.8"/>
  <text x="75" y="278" text-anchor="middle" font-family="Orbitron,monospace" font-size="9" fill="${cBat}" opacity="0.7">${f(soc,0)}%</text>

  <!-- Direction labels -->
  ${batCharge   ? `<text x="148" y="168" font-family="Cairo,sans-serif" font-size="10" fill="${cBat}" opacity="0.8">شحن ⬆</text>` : ''}
  ${batDischarge? `<text x="148" y="168" font-family="Cairo,sans-serif" font-size="10" fill="${cBat}" opacity="0.8">تفريغ ⬇</text>` : ''}
  ${gridExport  ? `<text x="320" y="88" font-family="Cairo,sans-serif" font-size="10" fill="${cGrid}" opacity="0.8">تصدير ⬆</text>` : ''}
  ${gridImport  ? `<text x="320" y="88" font-family="Cairo,sans-serif" font-size="10" fill="${cGrid}" opacity="0.8">استيراد ⬇</text>` : ''}
</svg>`;
}

}

function trow(name,val,unit,cls){
  let v;
  if(val!=null&&val!==undefined&&!isNaN(+val)){
    if((unit==="W"||unit==="A")&&unitMode==="A"){
      // convert watts to amps using VOLT
      v=(Math.abs(+val)/VOLT).toFixed(2);
      unit="A";
    } else {
      v=(+val).toFixed(unit==="kWh"?2:unit==="%"?1:1);
    }
  } else {
    v=val!=null?val:"—";
  }
  return`<div class="trow"><span class="tname">${name}</span><span class="tval ${cls}">${v}<small>${unit}</small></span></div>`;
}
function trowTxt(name,val,cls){
  return`<div class="trow"><span class="tname">${name}</span><span class="tval ${cls}" style="font-family:'Cairo',sans-serif;font-size:13px">${val||"—"}</span></div>`;
}

function renderAll(r){
  let html="";
  if(currentTab==="overview") html=buildOverview(r);
  else if(currentTab==="battery") html=buildBattery(r);
  else if(currentTab==="pv") html=buildPV(r);
  else if(currentTab==="grid") html=buildGrid(r);
  else if(currentTab==="eps") html=buildEPS(r);
  else if(currentTab==="stats") html=buildStats(r);
  document.getElementById("main").innerHTML=html;
  document.getElementById("uploadT").textContent=r.uploadTime||"—";
}

async function _load(){
  const btn=document.getElementById("rbtn"),dot=document.getElementById("dot"),stxt=document.getElementById("stxt");
  btn.disabled=true; btn.textContent="⏳ جاري...";
  dot.className="dot"; stxt.textContent="جاري...";
  try{
    const res=await fetch(PROXY,{
      method:"POST",
      headers:{"Content-Type":"application/json","tokenId":TOKEN,"x-cors-headers":JSON.stringify({"tokenId":TOKEN})},
      body:JSON.stringify({wifiSn:WIFI_SN})
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const json=await res.json();
    if(!json.success) throw new Error(json.exception||"فشل الاتصال");
    lastData=json.result;
    renderAll(lastData);
    dot.className="dot ok"; stxt.textContent="متصل";
    document.getElementById("lastUp").textContent=new Date().toLocaleTimeString("ar-IQ");
  }catch(e){
    document.getElementById("main").innerHTML=`<div class="errbox">⚠️ تعذّر الاتصال<br><span style="font-size:12px;opacity:.7">${e.message}</span></div>`;
    dot.className="dot err"; stxt.textContent="خطأ";
  }
  btn.disabled=false; btn.textContent="🔄 تحديث";
}
// ── Auto-refresh every 10 seconds with countdown ──
const REFRESH_SEC = 10;
let countdown = REFRESH_SEC;
let refreshTimer = null;
let countdownTimer = null;

function startCountdown(){
  clearInterval(countdownTimer);
  countdown = REFRESH_SEC;
  updateCountdown();
  countdownTimer = setInterval(()=>{
    countdown--;
    updateCountdown();
    if(countdown <= 0){
      countdown = REFRESH_SEC;
      load();
    }
  }, 1000);
}

function updateCountdown(){
  const el = document.getElementById("countdown");
  if(el){
    const pct = ((REFRESH_SEC - countdown) / REFRESH_SEC) * 100;
    el.style.background = `conic-gradient(var(--grid) ${pct*3.6}deg, transparent 0)`;
    el.title = `تحديث خلال ${countdown}ث`;
    const sp=document.getElementById("ctxt"); if(sp) sp.textContent=countdown;
  }
}

// ── localStorage for unit preference ──
function saveUnit(u){ try{ localStorage.setItem("solax_unit", u); }catch(e){} }
function loadUnit(){ try{ return localStorage.getItem("solax_unit")||"W"; }catch(e){ return "W"; } }

// Patch toggleUnit to save
const _origToggle = toggleUnit;
// redefine
function toggleUnit(){
  unitMode = unitMode==="W" ? "A" : "W";
  saveUnit(unitMode);
  const btn=document.getElementById("unitBtn");
  const lbl=document.getElementById("unitLabel");
  const sub=document.getElementById("unitSub");
  if(unitMode==="A"){
    btn.classList.add("amp"); lbl.textContent="A"; sub.textContent="أمبير";
  } else {
    btn.classList.remove("amp"); lbl.textContent="W"; sub.textContent="واط";
  }
  if(lastData) renderAll(lastData);
}

// Init: restore saved unit
unitMode = loadUnit();
if(unitMode==="A"){
  setTimeout(()=>{
    const btn=document.getElementById("unitBtn");
    const lbl=document.getElementById("unitLabel");
    const sub=document.getElementById("unitSub");
    if(btn){ btn.classList.add("amp"); lbl.textContent="A"; sub.textContent="أمبير"; }
  }, 0);
}

load();
startCountdown();
</script>
